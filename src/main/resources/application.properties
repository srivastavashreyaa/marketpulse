spring.application.name=smart-watchlist
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.min-response-size=512
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
spring.web.resources.cache.cachecontrol.no-cache=true

# Persistence: file-backed H2 by default; set JDBC_DATABASE_URL (+ username/password) for PostgreSQL.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/watchlistdb}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Market data
app.market.yahoo-enabled=${YAHOO_ENABLED:true}
app.market.demo-fallback=${DEMO_FALLBACK:true}
app.market.cache-ttl-seconds=45
app.market.max-symbols-per-user=30

logging.level.com.groww.watchlist=INFO

# Auth
app.auth.pbkdf2-iterations=${PBKDF2_ITERATIONS:210000}
